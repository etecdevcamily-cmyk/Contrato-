<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrato </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 50% 20%, #faf5ff 0%, #f3e8ff 50%, #e9d5ff 100%);
      color: #4c1d95;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Brilhos suaves no fundo */
    .sparkle-bg {
      position: absolute;
      font-size: 20px;
      opacity: 0.45;
      animation: floatSparkle 4s ease-in-out infinite alternate;
      user-select: none;
    }

    @keyframes floatSparkle {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(15deg); }
    }

    .contract-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      max-width: 460px;
      width: 100%;
      border-radius: 32px;
      padding: 40px 30px;
      box-shadow: 
        0 20px 40px rgba(126, 34, 206, 0.12),
        0 4px 16px rgba(168, 85, 247, 0.08),
        inset 0 0 0 2px #ffffff;
      border: 3px solid #f3e8ff;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .cute-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f3e8ff;
      color: #7e22ce;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-family: 'Comfortaa', cursive;
      color: #6b21a8;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .description {
      font-size: 14.5px;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 18px;
      padding: 0 6px;
    }

    /* Moldura fofa para a foto dos gatinhos */
    .kittens-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 8px auto 22px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #e9d5ff, #c084fc, #f3e8ff);
      box-shadow: 0 10px 24px rgba(168, 85, 247, 0.22);
      animation: pulseGently 3.5s ease-in-out infinite alternate;
    }

    @keyframes pulseGently {
      0% { transform: scale(1); box-shadow: 0 10px 24px rgba(168, 85, 247, 0.22); }
      100% { transform: scale(1.04); box-shadow: 0 14px 30px rgba(168, 85, 247, 0.32); }
    }

    .kittens-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      border: 3px solid #ffffff;
    }

    .mini-heart-floating {
      position: absolute;
      top: -2px;
      right: 4px;
      font-size: 24px;
      animation: heartBeat 1.4s ease-in-out infinite;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* Formulário */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 4px;
    }

    .signature-input {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid transparent;
      border-bottom: 2.5px solid #a855f7;
      background: #faf5ff;
      border-radius: 16px 16px 4px 4px;
      font-size: 16px;
      font-weight: 600;
      color: #581c87;
      outline: none;
      text-align: center;
      font-family: 'Quicksand', sans-serif;
      transition: all 0.25s ease;
    }

    .signature-input::placeholder {
      color: #c084fc;
      font-weight: 500;
      font-size: 14.5px;
    }

    .signature-input:focus {
      background-color: #ffffff;
      border-bottom: 2.5px solid #7e22ce;
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.12);
    }

    .sign-btn {
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Comfortaa', cursive;
      box-shadow: 0 8px 22px rgba(126, 34, 206, 0.32);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sign-btn:hover {
      background: linear-gradient(135deg, #9333ea 0%, #6b21a8 100%);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 28px rgba(126, 34, 206, 0.4);
    }

    .sign-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- Elementos decorativos no fundo -->
  <div class="sparkle-bg" style="top: 10%; left: 8%;">✨</div>
  <div class="sparkle-bg" style="bottom: 12%; left: 12%;">💜</div>
  <div class="sparkle-bg" style="top: 15%; right: 10%;">🌸</div>
  <div class="sparkle-bg" style="bottom: 18%; right: 9%;">✨</div>

  <main class="contract-card">
    <div class="cute-tag">✦ Acordo de Carinho Oficial ✦</div>
    
    <h1>Assine abaixo por gentileza</h1>
    
    <p class="description">
      Assine agora para continuar!
    </p>

    <!-- Foto de dois gatinhos fofos com moldura mágica e coração -->
    <div class="kittens-wrapper">
      <span class="mini-heart-floating">💜</span>
      <img 
        class="kittens-img" 
        src="https://images.unsplash.com/photo-1548802673-380ab8ebc7b7?auto=format&fit=crop&w=400&q=80" 
        alt="Dois gatinhos fofos juntinhos"
      />
    </div>

    <!-- Linha para nome e botão -->
    <form id="contractForm" class="input-group">
      <input 
        type="text" 
        id="girlfriendName" 
        class="signature-input" 
        placeholder="Digite seu lindo nome aqui... ✍️" 
        required 
        autocomplete="off"
      />
      <button type="submit" class="sign-btn">
        Assinar com Amor <span>💜</span>
      </button>
    </form>
  </main>

  <script>
    const form = document.getElementById('contractForm');
    const input = document.getElementById('girlfriendName');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (name) {
        localStorage.setItem('girlfriendContractName', name);
        window.location.href = 'pagina2.html';
      }
    });
  </script>
</body>
</html>
